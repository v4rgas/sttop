[project]
name = "sttop"
version = "0.1.0"
description = "Live speech-to-text monitor for the terminal. Taps mic + system audio, transcribes and labels speakers in real time, stores everything locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.80",
    "numpy>=1.24",
    "faster-whisper>=1.0.3",
    "webrtcvad-wheels>=2.0.14",
    "platformdirs>=4.0",
    "onnx-asr[cpu,hub]>=0.12",
]

[project.optional-dependencies]
# Speaker identification. Pulls torch, so it is opt-in.
diarize = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "speechbrain>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sttop = "sttop.__main__:main"

# Default torch to the CPU wheels. The stock PyPI torch bundles CUDA (~2.5GB) and
# CTranslate2 (faster-whisper) has no ROCm backend anyway, so a GPU build buys
# nothing here. To use an AMD GPU for diarization, resync against
# https://download.pytorch.org/whl/rocm6.2 instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sttop"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The wav and journal handles stay open for the length of a session by design,
# so a context manager cannot express their lifetime.
ignore = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
