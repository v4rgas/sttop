[project]
name = "sttop"
version = "0.3.1"
description = "Live speech-to-text monitor for the terminal. Taps mic + system audio, transcribes and labels speakers in real time, stores everything locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "v4rgas" }]
keywords = ["speech-to-text", "transcription", "whisper", "diarization", "tui", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80",
    "numpy>=1.24",
    "faster-whisper>=1.0.3",
    "webrtcvad-wheels>=2.0.14",
    "platformdirs>=4.0",
    "onnx-asr[cpu,hub]>=0.12",
    # Fallback ffmpeg, fetched on first use only when the system has none, so
    # a fresh `uvx sttop` records instead of printing a package name.
    "static-ffmpeg>=2.7",
    # macOS system audio: ScreenCaptureKit taps the output with no virtual
    # driver, and CoreMedia is what its buffers arrive in.
    "pyobjc-framework-ScreenCaptureKit>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=10.0; sys_platform == 'darwin'",
    # Speaker identification. Pulls torch, but the CPU wheels keep it manageable
    # and a transcript without speaker labels is not worth much.
    "torch>=2.2",
    "torchaudio>=2.2",
    "speechbrain>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sttop = "sttop.__main__:main"

[project.urls]
Homepage = "https://github.com/v4rgas/sttop"
Repository = "https://github.com/v4rgas/sttop"
Issues = "https://github.com/v4rgas/sttop/issues"

# Default torch to the CPU wheels. The stock PyPI torch bundles CUDA (~2.5GB) and
# CTranslate2 (faster-whisper) has no ROCm backend anyway, so a GPU build buys
# nothing here. To use an AMD GPU for diarization, resync against
# https://download.pytorch.org/whl/rocm6.2 instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The CPU index carries linux x86_64 and macOS arm64 wheels but no Intel-mac
# ones, so an Intel mac stays on PyPI - where the darwin torch build is CPU-only
# anyway, which is the whole point of the override.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sttop"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The wav and journal handles stay open for the length of a session by design,
# so a context manager cannot express their lifetime.
ignore = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
